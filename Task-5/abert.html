<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Age Eligibility Checker</h1>
    <script>
        let age=prompt("Enter your age:");
        age=Number(age);
        if(age>=0 && Number.isFinite(age) && Number.isInteger(age)){
            let result=age>=18?"You are eligible to vote.":"You are not eligible to vote.";
            alert(result);
            document.write("<h3>Age: "+age);
                document.write(result);
            }
            else{
                document.write("You enter wrong input");
            }
    </script>
</body>
</html>
